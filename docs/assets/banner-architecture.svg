<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="1120" height="230" role="img" aria-label="Lily API Hub Security and Gateway Pipeline">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#17153b" />
    </linearGradient>
    <linearGradient id="lineFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <clipPath id="archClip">
      <rect x="0" y="0" width="1120" height="230" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#archClip)">
    <rect width="1120" height="230" fill="url(#pipeBg)" />
    <text x="560" y="34" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">
      ISOLATED MASTER GATEWAY REQUEST LIFECYCLE
    </text>

    <!-- Connector Line -->
    <line x1="150" y1="118" x2="970" y2="118" stroke="url(#lineFlow)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.4s" repeatCount="indefinite" />
    </line>

    <!-- Flowing Light Packets -->
    <circle r="6" fill="#38bdf8">
      <animateMotion path="M 150 118 L 970 118" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#e879f9">
      <animateMotion path="M 150 118 L 970 118" begin="1.7s" dur="3.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 1: Customer Client -->
    <g transform="translate(40, 62)">
      <rect width="220" height="114" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />
      <rect x="14" y="14" width="76" height="20" rx="6" fill="rgba(56,189,248,0.16)" />
      <text x="52" y="28" text-anchor="middle" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">1. CLIENT</text>
      <text x="14" y="58" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="800">Developer App</text>
      <text x="14" y="80" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11.5">X-API-Key: lily_live_***</text>
      <text x="14" y="98" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11.5">Never sees Master Secret</text>
    </g>

    <!-- Node 2: Auth & Quota Engine -->
    <g transform="translate(310, 62)">
      <rect width="230" height="114" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.6" />
      <rect x="14" y="14" width="96" height="20" rx="6" fill="rgba(129,140,248,0.18)" />
      <text x="62" y="28" text-anchor="middle" fill="#c7d2fe" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">2. ENFORCE</text>
      <text x="14" y="58" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="800">Quota &amp; Rate Engine</text>
      <text x="14" y="80" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">SHA-256 · Sliding Window</text>
      <text x="14" y="98" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11.5">Atomic Daily / Monthly Check</text>
    </g>

    <!-- Node 3: Fernet Secret Vault -->
    <g transform="translate(590, 62)">
      <rect width="220" height="114" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6" />
      <rect x="14" y="14" width="84" height="20" rx="6" fill="rgba(245,158,11,0.18)" />
      <text x="56" y="28" text-anchor="middle" fill="#fde68a" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">3. INJECT</text>
      <text x="14" y="58" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="800">Fernet Key Vault</text>
      <text x="14" y="80" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">AES Decrypt in Memory</text>
      <text x="14" y="98" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="11.5">+ Context Headers</text>
    </g>

    <!-- Node 4: Master Upstream -->
    <g transform="translate(860, 62)">
      <rect width="220" height="114" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.6" />
      <rect x="14" y="14" width="96" height="20" rx="6" fill="rgba(16,185,129,0.18)" />
      <text x="62" y="28" text-anchor="middle" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">4. UPSTREAM</text>
      <text x="14" y="58" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="800">Master Backend API</text>
      <text x="14" y="80" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">Cloudflare Worker / Origin</text>
      <text x="14" y="98" fill="#34d399" font-family="Inter, sans-serif" font-size="11.5">Returns JSON + Telemetry</text>
    </g>

    <!-- Bottom Caption -->
    <text x="560" y="206" text-anchor="middle" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">
      X-RateLimit-Remaining · X-Quota-Daily-Remaining · X-Gateway-Mode: builtin | proxy
    </text>
  </g>
</svg>
