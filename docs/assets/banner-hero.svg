<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Lily API Hub Dynamic Animated Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f">
        <animate attributeName="stop-color" values="#090d1f;#11173a;#090d1f" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="52%" stop-color="#1b1548">
        <animate attributeName="stop-color" values="#1b1548;#25185c;#1b1548" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0b1f3a">
        <animate attributeName="stop-color" values="#0b1f3a;#0d2a48;#0b1f3a" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#34d399" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.2 0" to="0.2 0" dur="6s" repeatCount="indefinite" additive="sum" />
    </linearGradient>

    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#d946ef" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="340" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Gradient & Subtle Grid -->
    <rect width="1200" height="340" fill="url(#bgGrad)" />
    <rect width="1200" height="340" fill="url(#gridPattern)" />

    <!-- Floating Animated Orbs -->
    <circle cx="190" cy="80" r="220" fill="url(#orbViolet)">
      <animate attributeName="cx" values="170;240;170" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;115;70" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="250" r="240" fill="url(#orbCyan)">
      <animate attributeName="cx" values="980;910;980" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;205;250" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="590" cy="290" r="190" fill="url(#orbEmerald)">
      <animate attributeName="r" values="175;215;175" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Prism Top Accent Stripe -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#topBarGrad)" />

    <!-- Animated Orbital Particle Stream -->
    <path d="M -40 272 Q 290 218 610 264 T 1240 232" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1.5" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="4s" repeatCount="indefinite" />
    </path>
    <circle r="4" fill="#38bdf8">
      <animateMotion path="M -40 272 Q 290 218 610 264 T 1240 232" dur="5.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#e879f9">
      <animateMotion path="M -40 272 Q 290 218 610 264 T 1240 232" begin="2.75s" dur="5.5s" repeatCount="indefinite" />
    </circle>

    <!-- Left Brand Emblem with Orbit Ring -->
    <g transform="translate(106, 132)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="rgba(129,140,248,0.35)" stroke-width="1.5" stroke-dasharray="10 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="1.5" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
      </circle>
      <rect x="-34" y="-34" width="68" height="68" rx="18" fill="url(#logoGrad)" />
      <rect x="-34" y="-34" width="68" height="68" rx="18" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
      <text x="0" y="12" text-anchor="middle" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="800">L</text>
    </g>

    <!-- Title & Subtitle Block -->
    <g transform="translate(182, 86)">
      <!-- Eyebrow Pill -->
      <rect x="0" y="0" width="286" height="26" rx="13" fill="rgba(99,102,241,0.18)" stroke="rgba(165,180,252,0.36)" stroke-width="1" />
      <circle cx="15" cy="13" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="27" y="17" fill="#c7d2fe" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">ENTERPRISE API GATEWAY PLATFORM</text>

      <!-- Main Gradient Title -->
      <text x="0" y="76" fill="url(#titleGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.2">Lily API Hub</text>

      <!-- Tagline -->
      <text x="2" y="106" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="500">
        Master Key Isolation · Per-Plan Quotas · Razorpay Billing · Colorful Admin Center
      </text>

      <!-- Dynamic Status Chips -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="152" height="30" rx="9" fill="rgba(16,185,129,0.16)" stroke="rgba(52,211,153,0.42)" />
        <text x="14" y="19" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">✓ FastAPI + SQL</text>

        <rect x="164" y="0" width="166" height="30" rx="9" fill="rgba(56,189,248,0.16)" stroke="rgba(56,189,248,0.42)" />
        <text x="178" y="19" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">⚡ Master Proxy</text>

        <rect x="342" y="0" width="174" height="30" rx="9" fill="rgba(232,121,249,0.16)" stroke="rgba(232,121,249,0.42)" />
        <text x="356" y="19" fill="#f5d0fe" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">✦ .env Brandable</text>
      </g>
    </g>

    <!-- Right Animated Terminal Preview Card -->
    <g transform="translate(760, 56)">
      <rect x="0" y="0" width="388" height="224" rx="16" fill="rgba(2,6,23,0.86)" stroke="rgba(148,163,184,0.24)" stroke-width="1.2" />
      <rect x="0" y="0" width="388" height="34" rx="16" fill="rgba(15,23,42,0.95)" />
      <rect x="0" y="18" width="388" height="16" fill="rgba(15,23,42,0.95)" />
      <circle cx="18" cy="17" r="5" fill="#fb7185" />
      <circle cx="34" cy="17" r="5" fill="#fbbf24" />
      <circle cx="50" cy="17" r="5" fill="#34d399" />
      <text x="72" y="21" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11.5">POST /v1/crypto/hash</text>
      <rect x="316" y="8" width="58" height="18" rx="6" fill="rgba(16,185,129,0.2)" />
      <text x="345" y="20" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">200 OK</text>

      <text x="18" y="58" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">$ curl -s &quot;https://api.hub/v1/status&quot; \</text>
      <text x="26" y="76" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11.5">-H &quot;X-API-Key: lily_live_9f3a••••&quot;</text>

      <text x="18" y="106" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11.5">{</text>
      <text x="30" y="124" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="11.5">&quot;service&quot;: <tspan fill="#6ee7b7">&quot;Lily API Hub Gateway&quot;</tspan>,</text>
      <text x="30" y="142" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="11.5">&quot;mode&quot;: <tspan fill="#fde68a">&quot;hybrid-proxy&quot;</tspan>,</text>
      <text x="30" y="160" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="11.5">&quot;rate_remaining&quot;: <tspan fill="#38bdf8">299</tspan>,</text>
      <text x="30" y="178" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="11.5">&quot;status&quot;: <tspan fill="#34d399">&quot;operational&quot;</tspan></text>
      <text x="18" y="196" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11.5">}</text>
      <!-- Blinking Cursor -->
      <rect x="30" y="186" width="8" height="14" rx="2" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bottom Border Glow -->
    <rect x="0" y="337" width="1200" height="3" fill="url(#topBarGrad)" opacity="0.7" />
  </g>
</svg>
