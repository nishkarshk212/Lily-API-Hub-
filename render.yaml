services:
  - type: web
    name: lily-api-hub-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Lily API Hub
      - key: COMPANY_NAME
        value: Sonic Network
      - key: SUPPORT_EMAIL
        value: support@sonicnetwork.dev
      - key: BRAND_BADGE_LETTER
        value: ""
      - key: API_KEY_PREFIX_LIVE
        value: lily_live_
      - key: API_KEY_PREFIX_TEST
        value: lily_test_
      - key: RECEIPT_PREFIX
        value: LILY
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: GATEWAY_MODE
        value: hybrid
      - key: UPSTREAM_API_BASE_URL
        sync: false
      - key: UPSTREAM_AUTH_HEADER
        value: X-API-Key
      - key: UPSTREAM_AUTH_SCHEME
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lily-hub-db
          property: connectionString
      - key: MASTER_API_KEY
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

databases:
  - name: lily-hub-db
    plan: free
    databaseName: lily_hub
    user: lily_user

