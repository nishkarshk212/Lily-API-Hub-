[project]
name = "lily-api-hub"
version = "1.0.0"
description = "Lily API Hub by Sonic Network — Commercial API Gateway, Subscription & Razorpay Billing Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
